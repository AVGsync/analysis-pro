services:
  postgres:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net
  
  postgres-migrate:
    image: migrate/migrate:latest
    container_name: migrate
    volumes:
      - ./backend/migrations:/migrations
    networks:
      - app_net

  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "${POSTGRES_PORT}"
      BIND_ADDR: ${BIND_ADDR}
    ports:
      - "${BIND_ADDR}:${BIND_ADDR}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net

  swagger:
    build:
      context: ./backend
      dockerfile: Dockerfile.swagger
    profiles: ["swagger"]              
    volumes:
      - ./backend:/code

  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
