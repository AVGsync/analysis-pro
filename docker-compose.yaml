services:
  postgres:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net
  
  postgres-migrate:
    image: migrate/migrate:latest
    container_name: migrate
    volumes:
      - ./backend/migrations:/migrations
    networks:
      - app_net

  forecast:
    build: ./forecast
    container_name: forecast
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      POSTGRES_HOST: db   
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net

  swagger:
    build:
      context: ./backend
      dockerfile: Dockerfile.swagger
    profiles: ["swagger"]              
    volumes:
      - ./backend:/code

networks:
  app_net:
    driver: bridge

